<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Family Locator</title>
  <meta name="description" content="A consent-based live location app for family and friends." />
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============ ONBOARDING ============ -->
  <section id="onboarding" class="screen">
    <div class="card onboarding-card">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>Family Locator</h1>
      </div>
      <p class="tagline">See where each other are — only because everyone chose to share.</p>

      <form id="join-form" autocomplete="off">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" maxlength="24" placeholder="e.g. Mum, Chanda, Thabo" required />

        <label for="circle">Family circle code</label>
        <div class="row">
          <input id="circle" name="circle" type="text" maxlength="24" placeholder="e.g. banda-family" required />
          <button type="button" id="make-code" class="ghost" title="Generate a new code">New</button>
        </div>
        <p class="hint">Everyone who types the <em>same</em> code can see each other. Share it only with family.</p>

        <div class="consent">
          <input id="consent" type="checkbox" required />
          <label for="consent">I understand this shares <strong>my own</strong> live location with this circle, and I can stop anytime.</label>
        </div>

        <button type="submit" class="primary">Join circle</button>
      </form>

      <p class="fineprint" id="mode-note"></p>
    </div>
    <footer class="credit">Location is shared only while this page is open and only after you allow it on your device.</footer>
  </section>

  <!-- ============ MAP APP ============ -->
  <section id="app" class="screen" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand-dot small"></span>
        <strong id="circle-label">circle</strong>
      </div>
      <div class="topbar-right">
        <button id="share-toggle" class="pill off">Start sharing</button>
        <button id="leave" class="ghost">Leave</button>
      </div>
    </header>

    <div id="map"></div>

    <aside id="roster" class="roster">
      <div class="roster-head">
        <span id="roster-count">0 people</span>
        <button id="recenter" class="ghost small">Recenter</button>
      </div>
      <ul id="members"></ul>
      <p class="roster-foot" id="status-line">Not sharing yet.</p>
    </aside>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <!-- Optional: Firebase for real cross-phone sync. See README.md -->
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
